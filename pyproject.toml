[project]
name = "tax-cash-optimizer"
version = "0.1.0"
description = "Calcolo delle tasse per regime fiscale italiano e simulazione del rendimento della liquidità accantonata su conto deposito"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
app = ["streamlit>=1.50"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
